services:
  ecommerce-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-monolith-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=EcommerceMonolithDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ecommerce-monolith-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  product-catalog-service:
    build:
      context: ./src/ProductCatalogService
      dockerfile: Dockerfile
    container_name: product-catalog-service
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      MongoDbSettings__ConnectionString: mongodb://mongodb:27017
      MongoDbSettings__DatabaseName: ProductCatalogDb
      MongoDbSettings__ProductsCollectionName: Products
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7
    container_name: product-catalog-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  inventory-service:
    build:
      context: ./src/InventoryService
      dockerfile: Dockerfile
    container_name: inventory-service
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=inventory-sqlserver,1433;Database=InventoryServiceDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;Encrypt=False
    depends_on:
      - inventory-sqlserver

  inventory-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: YourStrongPassword123!
    ports:
      - "1435:1433"
    volumes:
      - inventory_sqlserver_data:/var/opt/mssql

  order-service:
    build:
      context: ./src/OrderService
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=order-sqlserver,1433;Database=OrderServiceDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;Encrypt=False
      ServiceUrls__ProductCatalogService: http://product-catalog-service:8080
      ServiceUrls__InventoryService: http://inventory-service:8080
    depends_on:
      - order-sqlserver
      - product-catalog-service
      - inventory-service

  order-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: order-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: YourStrongPassword123!
    ports:
      - "1436:1433"
    volumes:
      - order_sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
  mongodb_data:
  inventory_sqlserver_data:
  order_sqlserver_data: